  <p>Create Organization <button type="button" id="create-organization">+</button></p>
  <dialog id="create-org-dialog">
    <button type="button" id="close-dialog-button">Close</button>
    <h1>Create Organization</h1>
    <hr>
    <form id="create-organization-form">

      <!-- Name and description -->
      <fieldset id="name-desc-fieldset" class="registration-fieldset">
        <label for="create-title">Title:</label>
        <input type="text" id="create-title" name="create-title" required>

        <br>

        <label for="create-desc">Description:</label><br>
        <textarea id="create-desc" rows="4" cols="50" placeholer="Enter a short description of your organization here..."></textarea>
      </fieldset>

      <!-- TODO: make and extra details sction -->
      
      <button type="submit">Create</button>
    </form>
  </dialog>
